<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ToolShare - Home</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind.config.js"></script>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <!-- Flatpickr (Date Range Picker Vanilla JS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css"/>
</head>
<body class="text-on-surface antialiased min-h-screen pb-24 md:pb-0">
    <!-- TopNavBar -->
    <nav class="fixed top-0 left-0 w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 z-50 bg-white/5 backdrop-blur-lg border-b border-white/10 shadow-2xl">
        <div class="font-display text-headline-md-mobile md:text-headline-md text-primary tracking-tight">ToolShare</div>
        <div class="flex items-center gap-sm">
            <button class="text-on-surface-variant hover:bg-white/10 transition-colors p-2 rounded-full active:scale-95 transition-transform hidden">
                <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">search</span>
            </button>
            <button class="text-on-surface-variant hover:bg-white/10 transition-colors p-2 rounded-full active:scale-95 transition-transform">
                <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">notifications</span>
            </button>
            <div class="relative inline-block text-left ml-2" id="user-menu-container">
                <!-- Se actualiza por JS (main.js) -->
            </div>
        </div>
    </nav>

    <main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto">
        <!-- Hero Section -->
        <section class="mt-lg mb-lg text-center md:text-left">
            <h1 class="font-display text-display text-on-surface mb-md max-w-3xl">Herramientas compartidas, <br class="hidden md:block"/>progreso vecinal</h1>
            
            <!-- Search Bar -->
            <div class="glass-panel rounded-full p-2 flex items-center max-w-2xl mx-auto md:mx-0 shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
                <span class="material-symbols-outlined text-primary ml-sm mr-xs">search</span>
                <input id="search-input" class="bg-transparent border-none focus:ring-0 text-on-surface font-body-lg w-full placeholder-on-surface-variant/50" placeholder="¿Qué necesitas hoy? Ej: Taladro, Escalera..." type="text"/>
            </div>
        </section>

        <!-- Filter Chips -->
        <section class="mb-sm">
            <div id="filters-container" class="flex overflow-x-auto hide-scrollbar gap-sm py-2 px-1">
                <button class="px-md py-xs rounded-full bg-primary/20 border border-primary text-primary font-label-md whitespace-nowrap shadow-[0_0_15px_rgba(151,188,98,0.2)]">Todos</button>
                <button class="px-md py-xs rounded-full glass-panel text-on-surface-variant font-label-md hover:text-on-surface transition-colors whitespace-nowrap">Construcción</button>
                <button class="px-md py-xs rounded-full glass-panel text-on-surface-variant font-label-md hover:text-on-surface transition-colors whitespace-nowrap">Jardinería</button>
                <button class="px-md py-xs rounded-full glass-panel text-on-surface-variant font-label-md hover:text-on-surface transition-colors whitespace-nowrap">Pintura</button>
                <button class="px-md py-xs rounded-full glass-panel text-on-surface-variant font-label-md hover:text-on-surface transition-colors whitespace-nowrap">Limpieza</button>
                <button class="px-md py-xs rounded-full glass-panel text-on-surface-variant font-label-md hover:text-on-surface transition-colors whitespace-nowrap">Automotriz</button>
            </div>
        </section>

        <!-- Radius Banner -->
        <section class="mb-lg">
            <div class="glass-panel rounded-lg py-xs px-md flex items-center justify-center md:justify-start gap-2 border-l-2 border-l-primary/50">
                <span class="material-symbols-outlined text-on-surface-variant text-[18px]">location_on</span>
                <p class="font-body-md text-on-surface-variant text-sm">Buscando en un radio de 2km a tu alrededor</p>
            </div>
        </section>

        <!-- Tool Grid -->
        <section id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-gutter mb-xl">
            <!-- Las tarjetas se generan dinámicamente con JavaScript (renderCatalog) -->
        </section>
    </main>

    <!-- BottomNavBar (Mobile Only) -->
    <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface/80 backdrop-blur-xl border-t border-white/5 shadow-[0_-10px_40px_rgba(0,0,0,0.4)] rounded-t-xl md:hidden">
        <button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-2 active:scale-90 transition-all duration-200">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">search</span>
            <span class="font-label-sm text-label-sm">Explore</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200" onclick="window.location.href='dashboard.html'">
            <span class="material-symbols-outlined mb-1">handyman</span>
            <span class="font-label-sm text-label-sm">My Tools</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200">
            <span class="material-symbols-outlined mb-1">chat_bubble</span>
            <span class="font-label-sm text-label-sm">Messages</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200">
            <span class="material-symbols-outlined mb-1">person</span>
            <span class="font-label-sm text-label-sm">Profile</span>
        </button>
    </nav>
    <script src="db.js"></script>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</body>
</html>

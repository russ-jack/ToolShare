<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - ToolShare</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind.config.js"></script>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="./src/assets/css/styles.css"/>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden font-body-md text-body-md">
    <!-- Atmospheric Background -->
    <div class="fixed inset-0 z-0 bg-gradient-organic pointer-events-none"></div>
    
    <!-- Main Content Canvas -->
    <main class="flex-grow flex items-center justify-center relative z-10 px-margin-mobile md:px-margin-desktop py-lg">
        <div class="w-full max-w-[440px] glass-panel rounded-xl p-md md:p-lg flex flex-col gap-md transition-all duration-300 hover:scale-[1.01]">
            <!-- Header -->
            <div class="text-center flex flex-col gap-xs mb-sm">
                <h1 class="font-display text-display text-primary tracking-tight cursor-pointer" onclick="window.location.href='index.html'">ToolShare</h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant">Bienvenido de vuelta a tu vecindario.</p>
            </div>
            
            <!-- Social Auth -->
            <div class="flex flex-col gap-sm">
                <button type="button" onclick="window.location.href='dashboard.html'" class="btn-glass w-full rounded-lg py-sm px-md flex items-center justify-center gap-sm hover:bg-white/10 transition-colors duration-200 text-on-surface font-label-md text-label-md">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.09-1.93 3.3-4.78 3.3-8.09z" fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    </svg>
                    Continuar con Google
                </button>
                <button type="button" onclick="window.location.href='dashboard.html'" class="btn-glass w-full rounded-lg py-sm px-md flex items-center justify-center gap-sm hover:bg-white/10 transition-colors duration-200 text-on-surface font-label-md text-label-md">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.31-.88 3.5-.8 1.48.06 2.65.62 3.44 1.7-2.92 1.76-2.42 5.56.55 6.78-.71 1.83-1.58 3.61-2.57 4.49zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
                    </svg>
                    Continuar con Apple
                </button>
            </div>
            
            <div class="flex items-center gap-sm my-xs">
                <div class="h-px bg-white/10 flex-grow"></div>
                <span class="text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">O</span>
                <div class="h-px bg-white/10 flex-grow"></div>
            </div>
            
            <!-- Form -->
            <form id="login-form" class="flex flex-col gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-md text-label-md text-on-surface" for="email">Correo electrónico</label>
                    <input class="glass-input w-full rounded-lg py-sm px-md text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-all duration-200" id="email" placeholder="nombre@vecindario.com" required="" type="email"/>
                </div>
                <div class="flex flex-col gap-xs">
                    <div class="flex justify-between items-center">
                        <label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
                        <a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input class="glass-input w-full rounded-lg py-sm px-md text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
                </div>
                <button class="w-full bg-primary-container text-white font-label-md text-label-md rounded-lg py-sm px-md mt-sm hover:bg-[#97BC62] hover:text-black transition-colors duration-200 shadow-lg shadow-black/20" type="submit">
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Footer Link -->
            <div class="text-center mt-sm">
                <p class="font-body-md text-body-md text-on-surface-variant">
                    ¿No tienes una cuenta? <a class="text-primary hover:text-primary-fixed font-label-md text-label-md transition-colors" href="#">Regístrate</a>
                </p>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-transparent text-on-surface-variant font-label-sm text-label-sm full-width bottom-0 no-border flat no shadows duration-200 flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-8 gap-4 relative z-10">
        <div class="font-label-md text-label-md text-primary">ToolShare</div>
        <div class="flex flex-wrap justify-center gap-4">
            <a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Política de Privacidad</a>
            <a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Términos de Servicio</a>
            <a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Normas del Vecindario</a>
        </div>
        <div>
            © 2026 ToolShare Ecosystem. Todos los derechos reservados.
        </div>
    </footer>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
